<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Step 3: Platelet Count</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    :root{
      --bg:#0f1117;
      --surface:#181c27;
      --surface2:#1e2335;
      --border:rgba(255,255,255,.07);

      --accent:#4f8ef7;
      --accent2:#7c5cfc;
      --accent3:#2dd4a7;

      --text:#e8eaf0;
      --muted:#7a7f96;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
    }

    .page{
      width:100%;
      max-width:480px;
    }

    .logo-row{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-bottom:1.5rem;
    }

    .logo-row img{
      height:55px;
      object-fit:contain;
    }

    .step-badge{
      display:inline-block;
      padding:6px 14px;
      border-radius:20px;
      background:rgba(45,212,167,.12);
      color:var(--accent3);
      margin-bottom:1rem;
      font-size:.8rem;
    }

    h1{
      font-family:'DM Serif Display',serif;
      font-size:2rem;
      margin-bottom:.5rem;
    }

    .subtitle{
      color:var(--muted);
      margin-bottom:2rem;
      line-height:1.5;
    }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.5rem;
    }

    label{
      display:block;
      margin-bottom:.6rem;
      color:var(--muted);
      font-size:.8rem;
    }

    .input-wrapper{
      position:relative;
    }

    input{
      width:100%;
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px 90px 14px 16px;
      color:white;
      font-size:1rem;
      outline:none;
    }

    input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(79,142,247,.15);
    }

    .unit{
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      font-size:.8rem;
    }

    .btn-next{
      width:100%;
      margin-top:1.5rem;
      border:none;
      padding:14px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      font-weight:600;
      cursor:pointer;
    }

    .progress{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:1.5rem;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:var(--surface2);
    }

    .dot.done{
      background:var(--accent3);
    }

    .dot.active{
      background:var(--accent);
      width:24px;
    }

  </style>

</head>

<body>

<div class="page">

  <div class="logo-row">
    <img src="../assets/images/yashoda_logo.png.png" alt="Yashoda Hospitals" onerror="this.style.display='none'">
    <img src="../assets/images/bits%20logo" alt="BITS Pilani" onerror="this.style.display='none'">

  </div>

  <div class="step-badge">
    Step 3 of 3
  </div>

  <h1>Platelet Count</h1>

  <p class="subtitle">
    Enter platelet count from blood report.
  </p>

  <div class="card">

    <label>Platelet Count</label>

    <div class="input-wrapper">
      <input type="number" id="platelets" placeholder="e.g. 150">
      <span class="unit">×10⁹/L</span>
    </div>

    <button class="btn-next" onclick="savePlatelets()">
      Finish →
    </button>

  </div>

  <div class="progress">
    <div class="dot done"></div>
    <div class="dot done"></div>
    <div class="dot active"></div>
  </div>

</div>

<script>

  window.onload = function(){

    if(localStorage.getItem("step2Complete") !== "true"){

      alert("Please complete Step 2 first.");

      window.location.href = "themed_step2.html";

      return;

    }

    const saved =
      localStorage.getItem("platelets");

    if(saved){

      document.getElementById("platelets").value =
        saved;

    }

  };

  function savePlatelets(){

    const platelets =
      document.getElementById("platelets").value;

    if(platelets && platelets > 0){

      localStorage.setItem("platelets", platelets);

      localStorage.setItem("step3Complete", "true");

      window.location.href =
        "themed_index.html";

    }

    else{

      alert("Please enter valid Platelet Count.");

    }

  }

</script>

</body>
</html>
