<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Step 2: AST Upper Limit</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1117;
      --surface:#181c27;
      --surface2:#1e2335;
      --border:rgba(255,255,255,.07);
      --accent:#4f8ef7;
      --accent2:#7c5cfc;
      --accent3:#2dd4a7;
      --text:#e8eaf0;
      --muted:#7a7f96;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
    }

    .page{ width:100%; max-width:480px; }

    .logo-row{ display:flex; justify-content:center; gap:20px; margin-bottom:1.5rem; }
    .logo-row img{ height:55px; object-fit:contain; }

    .step-badge{
      display:inline-block;
      padding:6px 14px;
      border-radius:20px;
      background:rgba(124,92,252,.12);
      color:var(--accent2);
      margin-bottom:1rem;
      font-size:.8rem;
    }

    h1{ font-family:'DM Serif Display',serif; font-size:2rem; margin-bottom:.5rem; }
    .subtitle{ color:var(--muted); margin-bottom:2rem; line-height:1.5; }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.5rem;
    }

    label{ display:block; margin-bottom:.6rem; color:var(--muted); font-size:.8rem; }

    .input-wrapper{ position:relative; }

    input{
      width:100%;
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px 60px 14px 16px;
      color:white;
      font-size:1rem;
      outline:none;
    }

    input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(79,142,247,.15);
    }

    .unit{
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      color:var(--muted);
      font-size:.8rem;
    }

    .hint{
      margin-top:1rem;
      color:var(--muted);
      font-size:.82rem;
      line-height:1.5;
    }

    .btn-next{
      width:100%;
      margin-top:1.5rem;
      border:none;
      padding:14px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      font-weight:600;
      cursor:pointer;
      font-size:1rem;
      transition:.2s;
    }

    .btn-next:hover{ opacity:.9; }

    .back-link{
      display:block;
      text-align:center;
      margin-top:1rem;
      color:var(--muted);
      font-size:.85rem;
      cursor:pointer;
    }

    .back-link:hover{ color:var(--text); }

    .progress{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top:1.5rem;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:999px;
      background:var(--surface2);
      transition:.2s;
    }

    .dot.done{ background:var(--accent3); }
    .dot.active{ background:var(--accent2); width:24px; }
  </style>
</head>

<body>

<div class="page">

  <div class="logo-row">
    <img src="../assets/images/yashoda_logo.png.png" alt="Yashoda Hospitals" onerror="this.style.display='none'">
    <img src="../assets/images/bits%20logo" alt="BITS Pilani" onerror="this.style.display='none'">
  </div>

  <div class="step-badge">Step 2 of 3</div>

  <h1>AST Upper Limit</h1>

  <p class="subtitle">Enter laboratory AST upper normal limit.</p>

  <div class="card">

    <label>AST Upper Limit (ULN)</label>

    <div class="input-wrapper">
      <input type="number" id="astLimit" placeholder="e.g. 40" min="0" step="any">
      <span class="unit">U/L</span>
    </div>

    <div class="hint">
      Typical AST upper limit is <strong>40 U/L</strong>.
      Use your laboratory's specific reference value.
    </div>

    <button class="btn-next" onclick="saveLimit()">
      Save & Continue →
    </button>

  </div>

  <a class="back-link" onclick="location.href='themed_step1.html'">
    ← Back to Step 1
  </a>

  <div class="progress">
    <div class="dot done"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
  </div>

</div>

<script>

  window.onload = function () {
    if (localStorage.getItem("step1Complete") !== "true") {
      alert("Please complete Step 1 first.");
      window.location.href = "themed_step1.html";
      return;
    }

    const saved = localStorage.getItem("astLimit");
    if (saved) {
      document.getElementById("astLimit").value = saved;
    }
  };

  function saveLimit() {
    const astLimit = document.getElementById("astLimit").value;

    if (!astLimit || parseFloat(astLimit) <= 0) {
      alert("Please enter a valid AST Upper Limit greater than 0.");
      return;
    }

    localStorage.setItem("astLimit", astLimit);
    localStorage.setItem("step2Complete", "true");
    window.location.href = "themed_step3.html";
  }

</script>

</body>
</html>
