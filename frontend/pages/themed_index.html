<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APRI Calculator</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1117;
      --surface:#181c27;
      --surface2:#1e2335;
      --border:rgba(255,255,255,.07);
      --accent:#4f8ef7;
      --accent2:#7c5cfc;
      --accent3:#2dd4a7;
      --warn:#f4a642;
      --danger:#f46060;
      --text:#e8eaf0;
      --muted:#7a7f96;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      padding:2rem 1rem 4rem;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(79,142,247,.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(124,92,252,.07) 0%, transparent 70%);
      pointer-events:none;
    }

    .wrapper{
      max-width:760px;
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .header{ text-align:center; margin-bottom:2rem; }

    .logos{ display:flex; justify-content:center; gap:20px; margin-bottom:1.5rem; }
    .logos img{ height:55px; object-fit:contain; }

    h1{
      font-family:'DM Serif Display',serif;
      font-size:2.5rem;
      background:linear-gradient(120deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{ color:var(--muted); margin-top:.6rem; font-size:.95rem; }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:1.5rem;
      margin-bottom:1.5rem;
    }

    .card-title{
      font-size:.78rem;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      margin-bottom:1rem;
      font-weight:600;
    }

    .input-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .full{ grid-column:1 / -1; }

    label{ display:block; margin-bottom:.5rem; color:var(--muted); font-size:.82rem; }

    input, select{
      width:100%;
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 14px;
      color:white;
      font-size:.95rem;
      outline:none;
    }

    input:focus, select:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(79,142,247,.15);
    }

    /* Make select options visible */
    select option{ background:var(--surface2); color:var(--text); }

    .steps{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:1rem;
      margin-bottom:1.5rem;
    }

    .step-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      padding:1.2rem;
      text-align:center;
      cursor:pointer;
      transition:.2s;
    }

    .step-card:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.3); }
    .step-card.complete{ border-color:rgba(45,212,167,.3); }

    .step-num{ color:var(--muted); font-size:.72rem; margin-bottom:.5rem; text-transform:uppercase; letter-spacing:.08em; }
    .step-name{ font-weight:600; margin-bottom:.4rem; }
    .step-val{ color:var(--accent); font-size:.92rem; }

    .result-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:2rem;
      text-align:center;
      margin-bottom:1.5rem;
    }

    .result-label{ color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:.6rem; }

    .result-score{
      font-family:'DM Serif Display',serif;
      font-size:3rem;
      margin-bottom:.8rem;
    }

    .low{ color:var(--accent3); }
    .medium{ color:var(--warn); }
    .high{ color:var(--danger); }

    .interpretation{
      display:inline-block;
      padding:6px 16px;
      border-radius:999px;
      font-size:.9rem;
      font-weight:500;
    }
    .interpretation.low{ background:rgba(45,212,167,.12); }
    .interpretation.medium{ background:rgba(244,166,66,.12); }
    .interpretation.high{ background:rgba(244,96,96,.12); }

    .toast{
      position:fixed;
      bottom:2rem;
      left:50%;
      transform:translateX(-50%) translateY(100px);
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 24px;
      font-size:.9rem;
      transition:.3s;
      z-index:9999;
      pointer-events:none;
    }
    .toast.show{ transform:translateX(-50%) translateY(0); }
    .toast.success{ border-color:rgba(45,212,167,.4); color:var(--accent3); }
    .toast.error{ border-color:rgba(244,96,96,.4); color:var(--danger); }

    .actions{ display:flex; gap:1rem; flex-wrap:wrap; }

    .btn{
      flex:1;
      min-width:140px;
      border:none;
      border-radius:12px;
      padding:13px;
      font-size:.92rem;
      font-weight:600;
      cursor:pointer;
      transition:.2s;
    }
    .btn:hover{ transform:translateY(-1px); }
    .btn-submit{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }
    .btn-download{ background:var(--surface2); border:1px solid var(--border); color:white; }
    .btn-reset{ background:rgba(244,96,96,.12); border:1px solid rgba(244,96,96,.25); color:var(--danger); }

    .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

    @media(max-width:600px){
      .input-grid{ grid-template-columns:1fr; }
      .steps{ grid-template-columns:1fr; }
      .full{ grid-column:1; }
      h1{ font-size:2rem; }
    }
  </style>
</head>

<body>

<div class="wrapper">

  <div class="header">
    <div class="logos">
      <img src="../assets/images/yashoda_logo.png.png" alt="Yashoda Hospitals" onerror="this.style.display='none'">
      <img src="../assets/images/bits%20logo" alt="BITS Pilani" onerror="this.style.display='none'">
    </div>
    <h1>APRI Calculator</h1>
    <p class="subtitle">Liver Fibrosis Assessment</p>
  </div>

  <!-- Patient Information -->
  <div class="card">
    <div class="card-title">Patient Information</div>
    <div class="input-grid">

      <div class="full">
        <label>Patient Name</label>
        <input type="text" id="name" placeholder="Enter full name" oninput="savePatientInfo()">
      </div>

      <div>
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 35" oninput="savePatientInfo()">
      </div>

      <div>
        <label>Gender</label>
        <select id="gender" onchange="savePatientInfo()">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="full">
        <label>Patient ID</label>
        <input type="text" id="mobile" placeholder="Enter patient ID" oninput="savePatientInfo()">
      </div>

    </div>
  </div>

  <!-- Steps -->
  <div class="steps">

    <div class="step-card" id="stepCard1" onclick="location.href='themed_step1.html'">
      <div class="step-num">Step 1</div>
      <div class="step-name">AST Level</div>
      <div class="step-val" id="astVal">—</div>
    </div>

    <div class="step-card" id="stepCard2" onclick="goToStep2()">
      <div class="step-num">Step 2</div>
      <div class="step-name">AST Upper Limit</div>
      <div class="step-val" id="limitVal">—</div>
    </div>

    <div class="step-card" id="stepCard3" onclick="goToStep3()">
      <div class="step-num">Step 3</div>
      <div class="step-name">Platelet Count</div>
      <div class="step-val" id="plateletVal">—</div>
    </div>

  </div>

  <!-- Result -->
  <div class="result-card">
    <div class="result-label">APRI Score</div>
    <div class="result-score" id="score">—</div>
    <div class="interpretation" id="interpretation">Complete all steps</div>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button class="btn btn-submit" id="submitBtn" onclick="submitData()">Submit</button>
    <button class="btn btn-download" id="downloadBtn" onclick="downloadResult()">Download Report</button>
    <button class="btn btn-reset" onclick="clearAll()">Start Over</button>
  </div>

</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>

  /* ── Helpers ───────────────────────────────────────────── */

  function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = "toast"; }, 3000);
  }

  /* ── Persist patient info while navigating steps ────────── */

  function savePatientInfo() {
    localStorage.setItem("pt_name",   document.getElementById("name").value);
    localStorage.setItem("pt_age",    document.getElementById("age").value);
    localStorage.setItem("pt_gender", document.getElementById("gender").value);
    localStorage.setItem("pt_mobile", document.getElementById("mobile").value);
  }

  function restorePatientInfo() {
    const name   = localStorage.getItem("pt_name")   || "";
    const age    = localStorage.getItem("pt_age")    || "";
    const gender = localStorage.getItem("pt_gender") || "";
    const mobile = localStorage.getItem("pt_mobile") || "";

    document.getElementById("name").value   = name;
    document.getElementById("age").value    = age;
    document.getElementById("mobile").value = mobile;

    const gSelect = document.getElementById("gender");
    if (gender) gSelect.value = gender;
  }

  /* ── Step navigation guards ─────────────────────────────── */

  function goToStep2() {
    if (localStorage.getItem("step1Complete") !== "true") {
      showToast("Please complete Step 1 first.", "error");
      return;
    }
    location.href = "themed_step2.html";
  }

  function goToStep3() {
    if (localStorage.getItem("step2Complete") !== "true") {
      showToast("Please complete Steps 1 & 2 first.", "error");
      return;
    }
    location.href = "themed_step3.html";
  }

  /* ── Update score display ───────────────────────────────── */

  function updateUI() {
    restorePatientInfo();

    const ast      = localStorage.getItem("ast");
    const astLimit = localStorage.getItem("astLimit");
    const platelets = localStorage.getItem("platelets");

    document.getElementById("astVal").innerText     = ast      ? `${ast} U/L`      : "—";
    document.getElementById("limitVal").innerText   = astLimit ? `${astLimit} U/L` : "—";
    document.getElementById("plateletVal").innerText = platelets ? `${platelets} ×10⁹/L` : "—";

    // Highlight completed steps
    if (ast)      document.getElementById("stepCard1").classList.add("complete");
    if (astLimit) document.getElementById("stepCard2").classList.add("complete");
    if (platelets)document.getElementById("stepCard3").classList.add("complete");

    if (ast && astLimit && platelets) {

      const apri = ((parseFloat(ast) / parseFloat(astLimit)) / parseFloat(platelets)) * 100;
      const score = apri.toFixed(2);

      document.getElementById("score").innerText = score;

      const scoreEl  = document.getElementById("score");
      const interpEl = document.getElementById("interpretation");

      if (apri < 0.5) {
        scoreEl.className  = "result-score low";
        interpEl.className = "interpretation low";
        interpEl.innerText = "Minimal or No Fibrosis";
      } else if (apri <= 1.5) {
        scoreEl.className  = "result-score medium";
        interpEl.className = "interpretation medium";
        interpEl.innerText = "Moderate Fibrosis";
      } else {
        scoreEl.className  = "result-score high";
        interpEl.className = "interpretation high";
        interpEl.innerText = "Severe Fibrosis / Cirrhosis";
      }

    } else {
      document.getElementById("score").innerText      = "—";
      document.getElementById("score").className      = "result-score";
      document.getElementById("interpretation").innerText = "Complete all steps";
      document.getElementById("interpretation").className = "interpretation";
    }
  }

  /* ── Submit to backend ───────────────────────────────────── */

  async function submitData() {

    const name    = document.getElementById("name").value.trim();
    const age     = document.getElementById("age").value.trim();
    const gender  = document.getElementById("gender").value;
    const mobile  = document.getElementById("mobile").value.trim();
    const ast     = localStorage.getItem("ast");
    const astLimit = localStorage.getItem("astLimit");
    const platelets = localStorage.getItem("platelets");

    if (!name || !age || !gender || !mobile) {
      showToast("Please fill in all patient details.", "error");
      return;
    }

    if (!ast || !astLimit || !platelets) {
      showToast("Please complete all 3 steps first.", "error");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      const res = await fetch("http://localhost:5005/api/patients", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name,
          age:      parseInt(age),
          gender,
          mobile,
          ast:      parseFloat(ast),
          astLimit: parseFloat(astLimit),
          platelets: parseFloat(platelets)
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || `Server error ${res.status}`);
      }

      showToast("Patient data saved successfully!", "success");

    } catch (err) {
      showToast(`Failed: ${err.message}`, "error");
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  }

  /* ── Download report ─────────────────────────────────────── */

  function downloadResult() {

    const score  = document.getElementById("score").innerText;
    const interp = document.getElementById("interpretation").innerText;

    if (score === "—") {
      showToast("Complete all steps before downloading.", "error");
      return;
    }

    const content =
`APRI REPORT
═══════════════════════════════

Patient Name : ${document.getElementById("name").value || "N/A"}
Age          : ${document.getElementById("age").value || "N/A"}
Gender       : ${document.getElementById("gender").value || "N/A"}
Patient ID   : ${document.getElementById("mobile").value || "N/A"}

─────────────────────────────
AST Level    : ${localStorage.getItem("ast") || "N/A"} U/L
AST ULN      : ${localStorage.getItem("astLimit") || "N/A"} U/L
Platelets    : ${localStorage.getItem("platelets") || "N/A"} ×10⁹/L

─────────────────────────────
APRI Score   : ${score}
Result       : ${interp}
═══════════════════════════════
Generated : ${new Date().toLocaleString()}
`;

    const blob = new Blob([content], { type: "text/plain" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = `APRI_Report_${document.getElementById("mobile").value || "patient"}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  /* ── Clear everything ────────────────────────────────────── */

  function clearAll() {
    if (!confirm("This will erase all entered data. Continue?")) return;
    localStorage.clear();
    location.reload();
  }

  /* ── Init ─────────────────────────────────────────────────── */

  window.onload = updateUI;

</script>

</body>
</html>
